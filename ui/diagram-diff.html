<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Diagram Diff</title>
<!--
  Loaded from the local node_modules copy rather than a CDN, so the diff
  view works with no internet connection. `bpmn-js` is pinned in
  package.json; bpmn-embedded.css inlines the BPMN icon font as data URIs,
  avoiding a separate font request.
-->
<link rel="stylesheet" href="../node_modules/bpmn-js/dist/assets/diagram-js.css">
<link rel="stylesheet" href="../node_modules/bpmn-js/dist/assets/bpmn-js.css">
<link rel="stylesheet" href="../node_modules/bpmn-js/dist/assets/bpmn-font/css/bpmn-embedded.css">
<script src="../node_modules/bpmn-js/dist/bpmn-navigated-viewer.production.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    color: #1a1a1a;
  }
  #canvas { flex: 1; height: 100vh; background: #fff; }
  #sidebar {
    width: 300px;
    height: 100vh;
    overflow: auto;
    box-sizing: border-box;
    padding: 14px;
    background: #f7f7f8;
    border-left: 1px solid #ddd;
  }
  h1 { font-size: 14px; margin: 0 0 4px; word-break: break-all; }
  #summary { font-size: 12px; color: #555; margin-bottom: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #555; margin: 14px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  li { padding: 3px 0; border-bottom: 1px solid #eee; }
  .legend { display: flex; gap: 10px; font-size: 11px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .sw-added { background: #2e7d32; }
  .sw-changed { background: #b8860b; }
  .sw-removed { background: #c62828; }
  #error { color: #c62828; font-size: 12px; }

  /* bpmn-js marker classes applied via canvas.addMarker() */
  .diff-added .djs-visual > :nth-child(1) { stroke: #2e7d32 !important; stroke-width: 3px !important; }
  .diff-changed .djs-visual > :nth-child(1) { stroke: #b8860b !important; stroke-width: 3px !important; }
</style>
</head>
<body>
  <div id="canvas"></div>
  <div id="sidebar">
    <h1 id="fileName">Diagram Diff</h1>
    <div id="summary">loading...</div>

    <div class="legend">
      <span><i class="swatch sw-added"></i> Added</span>
      <span><i class="swatch sw-changed"></i> Changed</span>
      <span><i class="swatch sw-removed"></i> Removed (not in current diagram)</span>
    </div>

    <h2>Added</h2>
    <ul id="added"></ul>

    <h2>Changed</h2>
    <ul id="changed"></ul>

    <h2>Removed</h2>
    <ul id="removed"></ul>

    <div id="error"></div>
  </div>
<script src="diagram-diff.js"></script>
</body>
</html>
